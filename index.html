<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E7D32">
<title>FitApp — Contador de Calorias</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23C1440E'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle'%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
/* ============ TOKENS ============ */
:root{
  --paper:#dae6d6;
  --paper-2:#E9F0E7;
  --ink:#213124;
  --ink-soft:#657367;
  --line:#D7E1D7;
  --urucum:#2E7D32;
  --urucum-dark:#1B5E20;
  --couve:#2E7D32;
  --couve-bg:#E4F0E6;
  --milho:#C8941B;
  --milho-bg:#F6ECD4;
  --cafe:#8B5E3C;
  --cafe-bg:#EFE4D8;
  --card:#FFFFFF;
  --chart-line: #2E7D32;
  --chart-point: #1B5E20;
  --shadow:0 1px 2px rgba(36,31,26,.06), 0 4px 14px rgba(36,31,26,.05);
  --radius:16px;
  --serif:Georgia,'Noto Serif','Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Roboto','Segoe UI',sans-serif;
}
html[data-theme="dark"]{
  --paper:#141f18;
  --paper-2:#0B110D;
  --ink:#F1F6F1;
  --ink-soft:#b0beb2;
  --line:#1E2A20;
  --card:#141a14;
  --couve-bg:#142117;
  --milho-bg:#201F12;
  --cafe-bg:#21180F;
  --chart-line: #7bd980;
  --chart-point: #65ef6a;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 22px rgba(0,0,0,.38);
}
*{box-sizing:border-box;}
body{margin:0;}
html,body{-webkit-tap-highlight-color:transparent;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  padding-bottom:78px;
  min-height:100vh;
}
#app{max-width:520px;margin:0 auto;position:relative;}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;}
button{font-family:inherit;}
input,select{font-family:inherit;}
::selection{background:var(--urucum);color:#fff;}
:focus-visible{outline:2px solid var(--urucum);outline-offset:2px;}

/* ============ TOPBAR ============ */
.topbar{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:22px 20px 10px;
}
.topbar .brand{display:flex;flex-direction:column;}
.topbar .brand small{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);
  font-family:var(--sans);
}
.topbar h1{font-size:26px;color:var(--ink);}
.topbar h1 em{font-style:normal;color:var(--urucum);}
.iconbtn{
  background:var(--paper-2);border:1px solid var(--line);color:var(--ink);
  width:40px;height:40px;border-radius:12px;font-size:17px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}

/* ============ TABS ============ */
main{padding:0 16px 24px;}
.tab.hidden{display:none;}
.section-title{
  font-family:var(--serif);font-size:15px;color:var(--ink-soft);
  margin:22px 4px 10px;letter-spacing:.02em;
}
.section-title:first-child{margin-top:6px;}

/* ============ HERO PLATE (calorie ring) ============ */
.plate-wrap{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:22px 20px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:20px;
  margin-bottom: 7px;
}
.plate{
  position:relative;width:132px;height:132px;flex:none;border-radius:50%;
  background:conic-gradient(var(--urucum) calc(var(--pct,0)*1%), var(--paper-2) 0);
  display:flex;align-items:center;justify-content:center;
}
.plate::before{
  content:"";position:absolute;inset:10px;border-radius:50%;background:var(--card);
  box-shadow:inset 0 0 0 1px var(--line);
}
.plate .rim{
  position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 6px var(--paper);
}
.plate-num{position:relative;text-align:center;font-family:var(--serif);}
.plate-num b{font-size:26px;display:block;line-height:1;color:var(--ink);}
.plate-num span{font-size:11px;color:var(--ink-soft);font-family:var(--sans);}
.plate-meta{flex:1;}
.plate-meta .goalline{font-size:13px;color:var(--ink-soft);margin-bottom:10px;}
.plate-meta .goalline b{color:var(--ink);}
.macrobar{margin-bottom:9px;}
.macrobar:last-child{margin-bottom:0;}
.macrobar .mlabel{
  display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:3px;color:var(--ink-soft);
}
.macrobar .mlabel b{color:var(--ink);font-weight:600;}
.mtrack{height:6px;border-radius:4px;background:var(--paper-2);overflow:hidden;}
.mfill{height:100%;border-radius:4px;transition:width .35s ease;}
.mfill.protein{background:var(--couve);}
.mfill.carbs{background:var(--milho);}
.mfill.fat{background:var(--cafe);}

/* ============ MEAL CARDS ============ */
.meal-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);
}
.meal-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:13px 16px;border-bottom:1px solid var(--line);
}
.meal-head h3{font-size:15px;}
.meal-head .mkcal{font-size:12.5px;color:var(--ink-soft);}
.meal-add{
  background:none;border:1px dashed var(--line);color:var(--urucum);
  border-radius:10px;padding:4px 10px;font-size:12px;cursor:pointer;font-weight:600;
}
.entry{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:11px 16px;border-bottom:1px solid var(--line);
}
.entry:last-child{border-bottom:none;}
.entry .einfo{flex:1;min-width:0;}
.entry .ename{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.entry .esub{font-size:12px;color:var(--ink-soft);}
.entry .ekcal{font-size:13.5px;font-weight:700;color:var(--urucum);white-space:nowrap;}
.entry .edel{
  background:none;border:none;color:var(--ink-soft);font-size:16px;cursor:pointer;padding:2px 4px;
}
.empty-hint{
  padding:20px 16px;text-align:center;color:var(--ink-soft);font-size:13px;line-height:1.5;
}

/* ============ FOOD LIST / ADD TAB ============ */
.date-picker-bar{
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:11px 14px;margin-bottom:14px;
}
.date-picker-bar.not-today{ background:var(--milho-bg); border-color:var(--milho); }
.date-picker-bar .dpb-label{ display:flex; flex-direction:column; gap:1px; font-size:11.5px; color:var(--ink-soft); }
.date-picker-bar .dpb-label b{ font-size:14.5px; color:var(--ink); font-family:var(--serif); }
.date-picker-bar input[type="date"]{
  border:1px solid var(--line); border-radius:10px; padding:7px 9px;
  background:var(--paper); color:var(--ink); font-size:13px;
}
.dpb-today-btn{
  background:none; border:1px solid var(--urucum); color:var(--urucum);
  border-radius:8px; padding:6px 11px; font-size:12px; font-weight:700; cursor:pointer;
}
.search-wrap{position:relative;margin-bottom:14px;}
.search-wrap input{
  width:100%;padding:12px 14px 12px 38px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:15px;
}
.search-wrap::before{
  content:"🔎";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6;
}
.cat-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none;}
.cat-tabs::-webkit-scrollbar{display:none;}
.cat-chip{
  flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--ink-soft);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
}
.cat-chip.active{background:var(--urucum);border-color:var(--urucum);color:#fff;}
.food-card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:9px;overflow:hidden;
}
.food-row{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:13px 14px;cursor:pointer;
}
.food-row .fname{font-size:14.5px;font-weight:600;}
.food-row .fmeta{font-size:12px;color:var(--ink-soft);margin-top:1px;}
.food-row .fkcal{font-size:13px;color:var(--ink-soft);white-space:nowrap;}
.food-panel{
  padding:0 14px 16px;border-top:1px dashed var(--line);display:none;
}
.food-panel.open{display:block;padding-top:14px;}
.food-panel .hint{font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
.row-inline{display:flex;gap:10px;margin-bottom:10px;}
.row-inline .field{flex:1;}
.field label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
.field input,.field select{
  width:100%;padding:10px 11px;border-radius:10px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);font-size:15px;
}
.preview-macros{
  display:flex;justify-content:space-between;background:var(--paper-2);border-radius:10px;
  padding:10px 12px;margin-bottom:12px;
}
.preview-macros div{text-align:center;flex:1;}
.preview-macros b{display:block;font-size:15px;}
.preview-macros span{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--urucum);color:#fff;border:none;border-radius:12px;
  padding:12px 18px;font-size:14.5px;font-weight:700;cursor:pointer;width:100%;
}
.btn:active{background:var(--urucum-dark);}
.btn.secondary{background:var(--paper-2);color:var(--ink);border:1px solid var(--line);}
.btn.ghost{background:none;color:var(--urucum);border:1px solid var(--line);}
.custom-add-card{
  border:1.5px dashed var(--line);border-radius:14px;padding:14px;text-align:center;
  color:var(--urucum);font-weight:700;font-size:14px;cursor:pointer;margin-bottom:9px;
}

/* ============ FORMS (metas / peso / custom food) ============ */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;margin-bottom:14px;box-shadow:var(--shadow);
}
.card h3{font-size:15.5px;margin-bottom:14px;}
.card p.desc{font-size:12.5px;color:var(--ink-soft);margin:-8px 0 14px;line-height:1.5;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
details.calc{margin-top:6px;}
details.calc summary{
  cursor:pointer;font-size:13.5px;font-weight:700;color:var(--urucum);padding:6px 0;list-style:none;
}
details.calc summary::-webkit-details-marker{display:none;}
details.calc summary::before{content:"▸ ";}
details.calc[open] summary::before{content:"▾ ";}
.calc-result{
  background:var(--paper-2);border-radius:10px;padding:12px;margin:12px 0;font-size:13px;line-height:1.7;
}
.calc-result b{color:var(--urucum);}

/* ============ HISTORY ============ */
.hist-row{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px 15px;margin-bottom:9px;cursor:pointer;
}
.hist-row .hdate{font-size:14px;font-weight:700;text-transform:capitalize;}
.hist-row .hsub{font-size:12px;color:var(--ink-soft);}
.hist-row .hkcal{font-size:14px;font-weight:700;color:var(--urucum);}
.back-link{
  background:none;border:none;color:var(--urucum);font-weight:700;font-size:13.5px;
  padding:8px 0 4px;cursor:pointer;
}

/* ============ WEIGHT ============ */
.weight-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;
}
.weight-row:last-child{border-bottom:none;}
.weight-row .wdel{background:none;border:none;color:var(--ink-soft);font-size:15px;cursor:pointer;}

/* ============ BOTTOM NAV ============ */
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--card);border-top:1px solid var(--line);
  display:flex;max-width:520px;margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom);
  z-index:20;
}
.bottomnav button{
  flex:1;background:none;border:none;padding:10px 2px 8px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--ink-soft);font-size:10.5px;cursor:pointer;
}
.bottomnav button .ic{font-size:19px;}
.bottomnav button.active{color:var(--urucum);}

/* ============ DASHBOARD ============ */
.dashboard-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.kpi-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);}
.kpi-label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;}
.kpi-value{font-family:var(--serif);font-size:24px;font-weight:700;margin-top:4px;}
.kpi-sub{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.chart-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:12px;box-shadow:var(--shadow);}
.chart-card h3{font-size:16px;margin-bottom:8px;}
.period-tabs{display:flex;gap:7px;overflow:auto;padding-bottom:2px;}
.period-tab{border:1px solid var(--line);background:var(--paper-2);color:var(--ink-soft);border-radius:999px;padding:7px 11px;font-size:12px;white-space:nowrap;cursor:pointer;}
.period-tab.active{background:var(--urucum);border-color:var(--urucum);color:#fff;}
.bar-row{display:grid;grid-template-columns:92px 1fr 58px;gap:8px;align-items:center;margin:9px 0;font-size:12px;}
.bar-track{height:10px;background:var(--paper-2);border-radius:999px;overflow:hidden;}
.bar-fill{height:100%;background:var(--urucum);border-radius:999px;}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink-soft);margin-top:8px;}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:5px;}
@media (max-width:520px){.dashboard-grid{grid-template-columns:1fr 1fr}.bar-row{grid-template-columns:82px 1fr 50px;}}

/* ============ TOAST ============ */
#toast{
  position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;
  font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  z-index:50;max-width:90%;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ============ MODAL (custom food) ============ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(20,17,14,.5);display:none;
  align-items:flex-end;justify-content:center;z-index:60;
}
.modal-overlay.show{display:flex;}
.modal-sheet{
  background:var(--paper);width:100%;max-width:480px;border-radius:20px 20px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;
}
.modal-sheet h3{margin-bottom:14px;}
.modal-sheet .field{margin-bottom:10px;}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;}
}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <small id="today-label">Hoje</small>
      <h1>Fit<em>App</em></h1>
    </div>
    <button class="iconbtn" id="theme-toggle" title="Alternar tema">🌙</button>
  </div>

  <main>
    <section class="tab" id="tab-hoje"></section>
    <section class="tab hidden" id="tab-adicionar"></section>
    <section class="tab hidden" id="tab-dashboard"></section>
    <section class="tab hidden" id="tab-historico"></section>
    <section class="tab hidden" id="tab-peso"></section>
    <section class="tab hidden" id="tab-metas"></section>
  </main>

  <nav class="bottomnav">
    <button data-tab="hoje" class="active"><span class="ic">🏠</span><span>Hoje</span></button>
    <button data-tab="adicionar"><span class="ic">➕</span><span>Adicionar</span></button>
    <button data-tab="dashboard"><span class="ic">📊</span><span>Dashboard</span></button>
    <button data-tab="historico"><span class="ic">📅</span><span>Histórico</span></button>
    <button data-tab="peso"><span class="ic">⚖️</span><span>Peso</span></button>
    <button data-tab="metas"><span class="ic">⚙️</span><span>Metas</span></button>
  </nav>
</div>

<div id="toast"></div>
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-sheet" id="modal-sheet"></div>
</div>

<script src="foods.js"></script>
<script src="app.js"></script>
</body>
</html>
